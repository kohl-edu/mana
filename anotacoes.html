
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anotações — Um Tempo com Deus</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="bg-thorns"></div>

<header class="topbar">
  <a class="brand" href="index.html"><span>✦</span> Um Tempo com Deus</a>
  <button class="menu-toggle">☰</button>

  <nav class="nav">
    <a href="index.html">Início</a>
    <a href="versiculos.html">Versículos</a>
    <a href="reflexoes.html">Reflexões</a>
    <a class="active" href="anotacoes.html">Anotações</a>
    <a href="progresso.html">Meu espaço</a>
  </nav>

  <a class="profile-mini" href="login.html">Entrar</a>
</header>

<main class="container page">

  <div class="page-title">
    <p class="eyebrow">SEU CADERNO</p>
    <h1>Anotações</h1>
    <p>Registre aquilo que você não quer esquecer.</p>
  </div>

  <section class="notes-layout">

    <div class="note-editor glass">

      <div class="editor-top">
        <h2>Nova anotação</h2>
        <span id="noteDate"></span>
      </div>

      <input id="noteTitle" type="text" placeholder="Título da anotação">

      <textarea id="noteBody" placeholder="Escreva seus pensamentos, aprendizados, pedidos de oração..."></textarea>

      <div class="editor-bottom">
        <span>Suas anotações ficam salvas neste dispositivo.</span>
        <button class="btn btn-primary" id="saveNote">Guardar anotação</button>
      </div>

    </div>

    <div>
      <div class="notes-list-head">
        <h2>Minhas anotações</h2>
        <span id="noteCount">0</span>
      </div>

      <div id="notesList" class="notes-list"></div>
    </div>

  </section>

</main>

<footer>
  <div class="container footer-inner">
    <span>Um Tempo com Deus</span>
    <span>Um caderno para a caminhada.</span>
  </div>
</footer>

<script src="js/app.js"></script>
<script src="js/notes.js"></script>

</body>
</html>

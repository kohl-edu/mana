<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Um Tempo com Deus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-thorns"></div>
<main class="login-page">
  <div class="login-card glass">
    <a class="brand login-brand" href="index.html"><span>✦</span> Um Tempo com Deus</a>
    <p class="eyebrow">SEU ESPAÇO PESSOAL</p>
    <h1 id="loginTitle">Bem-vindo de volta.</h1>
    <p class="login-intro" id="loginIntro">Entre para acessar seus registros em qualquer dispositivo.</p>

    <div class="topic-row" style="margin-bottom:22px">
      <button class="chip active" type="button" id="modeLogin">Entrar</button>
      <button class="chip" type="button" id="modeSignup">Criar conta</button>
    </div>

    <form id="loginForm">
      <label id="nameField" style="display:none">
        Seu nome
        <input id="loginName" autocomplete="name" placeholder="Como podemos chamar você?">
      </label>

      <label>
        E-mail
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="voce@email.com">
      </label>

      <label>
        Senha
        <input id="loginPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="Pelo menos 6 caracteres">
      </label>

      <button class="btn btn-primary full" type="submit" id="submitLogin">Entrar no meu espaço</button>
    </form>

    <p class="small-note" id="loginNote">
      Seus registros são sincronizados com sua conta quando o armazenamento online estiver configurado.
    </p>

    <a class="back-link" href="index.html">← Voltar para o início</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Um Tempo com Deus</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-thorns"></div>
  <main class="login-page">
    <div class="login-card glass">
      <a class="brand login-brand" href="index.html"><span>✦</span> Um Tempo com Deus</a>
      <p class="eyebrow">RECUPERAÇÃO DE CONTA</p>
      <h1 style="font-size:clamp(2.3rem,5vw,3.5rem)">Crie uma nova senha.</h1>
      <p class="login-intro" id="resetIntro">Abra esta página pelo link de recuperação enviado ao seu e-mail.</p>
      <form id="resetForm">
        <label>
          Nova senha
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Use pelo menos 8 caracteres">
        </label>
        <label>
          Confirme a nova senha
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Digite a senha novamente">
        </label>
        <button class="btn btn-primary full" type="submit" id="resetSubmit">Salvar nova senha</button>
      </form>
      <p class="small-note" id="resetNote">Use uma senha forte que você ainda não usa em outros sites.</p>
      <a class="back-link" href="login.html">← Voltar para entrar</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
  <script>
    const resetForm = document.getElementById("resetForm");
    const resetIntro = document.getElementById("resetIntro");
    const resetNote = document.getElementById("resetNote");
    const resetSubmit = document.getElementById("resetSubmit");

    function showMessage(message) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    window.UTCDReady.then(() => {
      if (!window.UTCDCloud.isSignedIn()) {
        resetIntro.textContent = "Não encontramos uma sessão de recuperação ativa. Solicite um novo link na página de entrada.";
        resetSubmit.disabled = true;
        resetNote.textContent = "Volte para Entrar e clique em “Esqueci minha senha” para receber outro e-mail.";
      }
    });

    resetForm.addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      if (password.length < 8) {
        showMessage("A senha precisa ter pelo menos 8 caracteres.");
        return;
      }
      if (password !== confirmation) {
        showMessage("As senhas não coincidem.");
        return;
      }
      if (!window.UTCDCloud.isSignedIn()) {
        showMessage("Solicite um novo link de recuperação antes de continuar.");
        return;
      }
      resetSubmit.disabled = true;
      resetSubmit.textContent = "Salvando...";
      try {
        await window.UTCDCloud.updatePassword(password);
        resetIntro.textContent = "Sua senha foi atualizada. Agora você já pode entrar com a nova senha.";
        resetForm.style.display = "none";
        resetNote.textContent = "Por segurança, volte à página de entrada e faça login novamente.";
        showMessage("Senha redefinida com sucesso!");
      } catch (error) {
        console.error("Erro ao redefinir senha:", error);
        const msg = String(error?.message || error);
        showMessage(msg.toLowerCase().includes("same") ? "Escolha uma senha diferente da anterior." : "Não foi possível redefinir a senha: " + msg);
        resetSubmit.disabled = false;
        resetSubmit.textContent = "Salvar nova senha";
      }
    });
  </script>
</body>
</html>
